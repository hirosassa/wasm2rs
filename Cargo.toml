[package]
name = "wasm2rs"
version = "0.5.0"
edition = "2024"
rust-version.workspace = true
description = "Transpile WebAssembly binaries into standalone native Rust source code."
license = "MIT"
repository = "https://github.com/hirosassa/wasm2rs"
readme = "README.md"
keywords = ["webassembly", "wasm", "transpiler", "codegen"]
categories = ["compilers", "development-tools", "wasm"]
# Integration tests are consolidated into a single binary (`tests/it/main.rs`)
# so the suite links once instead of once per file; disable auto-discovery so
# the sole target below is the only integration-test crate.
autotests = false
# The differential fuzzer is a separate crate (heavy wasmtime dependency); keep it
# out of the published package.
exclude = ["fuzz-diff", "fuzz"]

# One integration-test crate that bundles every former `tests/<name>.rs` as a
# submodule. Run a subset with `cargo test --test it <name>`.
[[test]]
name = "it"
path = "tests/it/main.rs"

# `cli` (default) is what the `wasm2rs` binary needs; it pulls in mimalloc as the
# global allocator to keep peak RSS down on huge modules (see `src/main.rs`).
# Library users can depend on this crate with `default-features = false` to avoid
# building mimalloc's C code, since the library never uses it.
[features]
default = ["cli"]
cli = ["dep:mimalloc"]

[workspace]
members = ["wasm2rs-macros", "wasm2rs-wasi"]

[workspace.package]
# Measured: wasmparser 0.263 needs 1.88 for the libraries and the CLI, but the
# examples and tests use `File::lock` (stable in 1.89), so every target needs 1.89.
rust-version = "1.89"

[lints]
workspace = true

[dependencies]
# `serde` is left out of wasmparser's defaults: the transpiler never (de)serializes parser types.
wasmparser = { version = "0.263.0", default-features = false, features = ["std", "validate", "features", "component-model", "hash-collections", "simd"] }
mimalloc = { version = "0.1", optional = true }

[dev-dependencies]
wat = "1.263.0"
wast = "263.0.0"
wit-component = { version = "0.263", features = ["dummy-module"] }
wit-parser = "0.263"
# The typed WASI host that the tests and `examples/wasip2_run.rs` link into generated programs.
wasm2rs-wasi = { path = "wasm2rs-wasi" }

# Hardening gates (rust-hardening skill), inherited by every member via
# `[lints] workspace = true`. Only lints with zero findings in every member's
# production code belong here; `clippy::panic`, `unwrap_in_result` and
# `cast_possible_truncation` are denied per-crate in src/lib.rs and src/main.rs
# until wasm2rs-wasi is clean. The root crate is a code generator, so several
# restriction lints fire on intentional index/offset arithmetic and casts; those
# are enabled incrementally (see "Deferred" below). Test code relaxes the
# panic-prone subset with a scoped `#[allow(..., reason = "test code")]`.
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"          # no `unsafe` in src today; keep it an opt-in exception
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Panic-prone constructs with zero production findings — denied outright.
todo = "deny"
unimplemented = "deny"
# Float and lossy-cast foot-guns, none present in production.
float_cmp = "deny"
lossy_float_literal = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# Suppression hygiene: every `#[allow]`/`#[expect]` must carry a `reason`.
allow_attributes_without_reason = "deny"
#
# Deferred — these still fire in production `src/` (the code generator's
# intentional lowering); left at clippy's default so the build stays green while
# a follow-up hardens them per item (checked_*/.get()/TryFrom/#[expect]). Counts
# for the root crate's lib and bin targets (clippy 1.99, 2026-11-14):
#   arithmetic_side_effects 146, let_underscore_must_use 89 (`let _ = write!(String, …)`,
#   infallible), as_conversions 78, indexing_slicing 60, string_slice 25, unreachable 7,
#   cast_lossless 2, unwrap_used 2, expect_used 1.

# Keep file:line info for panics/test failures but drop full variable/type
# debug info. Shrinks the test binary and cuts link time on macOS.
[profile.dev]
debug = "line-tables-only"
