[package]
name = "wasm2rs"
version = "0.1.0"
edition = "2024"

[dependencies]
wasmparser = "0.255.0"
mimalloc = "0.1"

[dev-dependencies]
wat = "1.255.0"

# Keep file:line info for panics/test failures but drop full variable/type
# debug info. Shrinks the 54 test binaries and cuts link time on macOS.
[profile.dev]
debug = "line-tables-only"
