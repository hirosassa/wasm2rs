coverage:
  status:
    # Per-crate component statuses cover this; disable the global one to avoid duplicate checks
    project: off
    patch:
      default:
        target: auto
        threshold: 1%

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto # Components without an explicit target must not drop below the base commit
        threshold: 1% # Tolerate tiny fluctuations
  individual_components:
    - component_id: core
      # Floor set slightly below the measured 95.24% (2026-11-13)
      statuses:
        - type: project
          target: 94%
          threshold: 1%
      name: wasm2rs (core)
      paths:
        - src/**
    - component_id: macros
      # Floor set slightly below the measured 92.27% (2026-11-13)
      statuses:
        - type: project
          target: 90%
          threshold: 1%
      name: wasm2rs-macros
      paths:
        - wasm2rs-macros/**
    - component_id: wasi
      # Floor set slightly below the measured 83.93% (2026-11-13)
      statuses:
        - type: project
          target: 82%
          threshold: 1%
      name: wasm2rs-wasi
      paths:
        - wasm2rs-wasi/**
