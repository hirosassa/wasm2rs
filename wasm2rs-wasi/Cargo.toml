[package]
name = "wasm2rs-wasi"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "Typed WASI 0.2 host for programs transpiled by wasm2rs."
license = "MIT"
repository = "https://github.com/hirosassa/wasm2rs"
readme = "README.md"
keywords = ["webassembly", "wasm", "wasi"]
categories = ["wasm"]

[features]
default = ["os-random"]
# The OS's CSPRNG (through `getrandom`) as the default source of `wasi:random/random`.
# Without it a `RandomSource` must be given to the builder.
os-random = ["dep:getrandom"]
# `UreqClient`, an `HttpClient` over `ureq` (TLS through rustls, as `ureq` enables it by default).
http-client = ["dep:ureq"]

[dependencies]
getrandom = { version = "0.4", optional = true }
# Capability-based file access: a directory descriptor holds an open directory and every path
# is resolved below it in one step (`openat` with `O_NOFOLLOW` per component), so a symlink
# swapped in after a check cannot lead out of a preopen.
cap-std = "4"
cap-fs-ext = "4"
# `gzip` is left out: the guest must see the body as it came (with its `content-encoding`),
# not decoded.
ureq = { version = "3.4.3", optional = true, default-features = false, features = ["rustls"] }

# Windows gives a file's volume serial and index only for an open handle; this reads them
# through a safe wrapper (`unsafe_code` is denied here).
[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"

[lints]
workspace = true
