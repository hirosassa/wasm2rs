name: Release

on:
  push:
    tags:
      # Semver tags like `v0.1.0`. The version part must match `Cargo.toml`.
      - 'v[0-9]+.*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Guard the whole release: refuse to publish anything when the pushed tag does
  # not match the crate version, so an irreversible `cargo publish` cannot run
  # against a mismatched tag.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check tag matches Cargo.toml version
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag_version=${GITHUB_REF_NAME#v}
          echo "tag=$tag_version crate=$crate_version"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "::error::tag $tag_version does not match Cargo.toml version $crate_version"
            exit 1
          fi

  # Create the GitHub Release for the tag; binaries attach to it below.
  create-release:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: taiki-e/create-gh-release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build the CLI binary natively per OS and attach an archive to the release.
  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: wasm2rs
          target: ${{ matrix.target }}
          # Archive name, e.g. `wasm2rs-x86_64-unknown-linux-gnu.tar.gz`.
          archive: $bin-$target
          tar: unix
          zip: windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the library to crates.io last: it is irreversible, so it runs only
  # after the release and all binaries have been produced successfully.
  publish-crate:
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
