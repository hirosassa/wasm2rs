name: Release

on:
  push:
    tags:
      # Semver tags like `v0.1.0`. The version part must match `Cargo.toml`.
      - 'v[0-9]+.*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Guard the whole release: refuse to publish anything when the pushed tag does
  # not match the crate version, so an irreversible `cargo publish` cannot run
  # against a mismatched tag.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tag matches Cargo.toml version
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "wasm2rs") | .version')
          tag_version=${GITHUB_REF_NAME#v}
          echo "tag=$tag_version crate=$crate_version"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "::error::tag $tag_version does not match Cargo.toml version $crate_version"
            exit 1
          fi

  # Create the GitHub Release for the tag; binaries attach to it below.
  create-release:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1.11.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build the CLI binary natively per OS and attach an archive to the release.
  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: wasm2rs
          target: ${{ matrix.target }}
          # Archive name, e.g. `wasm2rs-x86_64-unknown-linux-gnu.tar.gz`.
          archive: $bin-$target
          tar: unix
          zip: windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the crates to crates.io last: it is irreversible, so it runs only
  # after the release and all binaries have been produced successfully.
  # `wasm2rs-macros` depends on `wasm2rs`, so it goes second.
  publish-crate:
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Publish wasm2rs to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # `cargo publish` waits until the new `wasm2rs` is visible in the index, so
      # the dependency of `wasm2rs-macros` resolves.
      - name: Publish wasm2rs-macros to crates.io
        run: cargo publish -p wasm2rs-macros --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
