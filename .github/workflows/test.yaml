name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Check on ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ${{ matrix.rust }}
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
          rustup default ${{ matrix.rust }}
          rustup target add wasm32-wasip1-threads

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build-${{ matrix.rust }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run cargo check
        run: cargo check

      - name: Check library builds without the CLI feature (no mimalloc)
        run: cargo build --lib --no-default-features

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run cargo clippy with the http-client feature
        run: cargo clippy -p wasm2rs-wasi --all-targets --features http-client -- -D warnings

      # The `os-random` feature (default) pulls in getrandom; without it a random source
      # is required, which `tests/config.rs` checks.
      - name: Test wasm2rs-wasi without default features
        run: cargo test -p wasm2rs-wasi --no-default-features

      # `UreqClient` (feature `http-client`, off by default) against a loopback server.
      - name: Test wasm2rs-wasi with the http-client feature
        run: cargo test -p wasm2rs-wasi --features http-client --test http_client

      # The Rust wasi-threads E2E test must run here, not skip (see
      # docs/wasi-threads-e2e.md). The wasi-sdk tests skip here; the
      # e2e-wasi-sdk job runs them. The full suite runs on stable only; beta and
      # nightly just have to compile it.
      - name: Run cargo test
        if: matrix.rust == 'stable'
        run: cargo test --release --workspace
        env:
          WASM2RS_REQUIRE_E2E: rust

      - name: Build the tests (compile compatibility only)
        if: matrix.rust != 'stable'
        run: cargo test --release --workspace --no-run

  # wasm2rs-wasi's preopen confinement (cap-std) has Unix-only code paths and tests; this
  # job verifies the rest on Windows (#205). Only the wasm2rs-wasi crate: the transpiler's
  # E2E tests need Unix toolchains.
  wasi-windows:
    name: wasm2rs-wasi on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: wasi-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test wasm2rs-wasi
        run: cargo test -p wasm2rs-wasi

  # The wasi-sdk E2E tests need a ~190MB toolchain, so they live in their own job
  # (cached) instead of slowing down every toolchain of the build matrix.
  e2e-wasi-sdk:
    name: E2E with wasi-sdk
    runs-on: ubuntu-latest
    env:
      # To bump wasi-sdk, change both and the release tag in the download URL
      # (the sha256 is of the release tarball; it also keys the cache).
      WASI_SDK_TARBALL: wasi-sdk-34.0-x86_64-linux.tar.gz
      WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1-threads

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: e2e-wasi-sdk
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache wasi-sdk
        id: wasi-sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_SHA256 }}

      - name: Download wasi-sdk
        if: steps.wasi-sdk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wasi-sdk.tar.gz" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/$WASI_SDK_TARBALL"
          echo "$WASI_SDK_SHA256  $RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/wasi-sdk"
          tar xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$HOME/wasi-sdk" --strip-components=1

      # Both tools are required, so a missing one fails instead of skipping. emsdk is
      # not installed here (the e2e-emsdk job has it), so its tests skip.
      - name: Run the E2E tests
        run: |
          export WASI_SDK_PATH="$HOME/wasi-sdk"
          cargo test --release --test it wasi_sdk_e2e -- --nocapture
        env:
          WASM2RS_REQUIRE_E2E: "rust,wasi-sdk"

  # The emscripten E2E tests need an emsdk (several hundred MB), so they also get
  # their own cached job. Only they run here; the wasi-sdk ones run above.
  e2e-emsdk:
    name: E2E with emsdk
    runs-on: ubuntu-latest
    env:
      # To bump emsdk, change this one value: it is the emsdk git tag, the SDK
      # version to install, and the cache key.
      EMSDK_VERSION: 6.0.13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1-threads

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: e2e-emsdk
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"

      # emsdk is required, so a missing one fails instead of skipping. The
      # filter picks the emscripten tests, which all start with `an_emscripten`.
      - name: Run the emscripten E2E tests
        run: |
          export EMSDK="$HOME/emsdk"
          cargo test --release --test it an_emscripten -- --nocapture
        env:
          WASM2RS_REQUIRE_E2E: emsdk

  # fuzz/ is a detached workspace (nightly + libFuzzer to *run*), so the main jobs never
  # build it. Only the stable-buildable parts run here: that the targets still compile and
  # that the fixed-input boundary tests pass. Fuzzing itself stays manual
  # (docs/fuzzing-http-server.md). fuzz-diff/ is not built in CI: it pulls in wasmtime.
  fuzz-crate:
    name: Check fuzz/ crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # rustc is in the key: `stable` moves, and artifacts of another rustc are unusable.
      - name: Get rustc version
        id: rustc
        run: echo "v=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache fuzz/ target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/target
          key: fuzz-target-${{ runner.os }}-${{ steps.rustc.outputs.v }}-${{ hashFiles('fuzz/Cargo.lock') }}

      - name: Check the fuzz targets build
        working-directory: fuzz
        run: cargo check --bins --locked

      - name: Test the fuzz boundary contracts
        working-directory: fuzz
        run: cargo test --locked

  coverage:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --component llvm-tools-preview
      # Own key: --all-features and llvm-cov instrumentation differ from the other jobs.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov
      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
